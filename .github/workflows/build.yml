# Builds Pawn Party whenever code reaches main, and on pull requests
# targeting main so breakage is caught before it merges.
#
# This workflow only *checks* that the app builds. Deploying is handled
# separately by AWS Amplify, which watches the main branch.
name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets you run this by hand from the Actions tab.
  workflow_dispatch:

# The workflow only reads the repo; it never pushes anything back.
permissions:
  contents: read

# If several pushes land quickly, only finish the newest one.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the app
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Reads .nvmrc, so CI, Amplify and your laptop agree on one version.
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` installs the exact versions in package-lock.json.
      # It is the reproducible sibling of `npm install`.
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Keeps the built files downloadable from the run's summary page,
      # which is handy for checking what a given commit produced.
      - name: Save the build output
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 14
          if-no-files-found: error

  version:
    name: Version bumped
    runs-on: ubuntu-latest
    # Only meaningful on a pull request, where there is a base to compare to.
    if: github.event_name == 'pull_request'

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Compare the version against the base branch
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail

          # Escape hatch: label a PR `no-release` when it genuinely ships no
          # user-visible change (a typo in a comment, a CI tweak).
          case ",${PR_LABELS}," in
            *,no-release,*)
              echo "PR is labelled 'no-release' — skipping the version check."
              exit 0
              ;;
          esac

          git fetch --no-tags --depth=1 origin "$BASE_REF"
          base=$(git show "FETCH_HEAD:package.json" | jq -r .version)
          head=$(jq -r .version package.json)
          echo "base ($BASE_REF): $base"
          echo "this PR:          $head"

          if [ "$head" = "$base" ]; then
            echo "::error file=package.json::Version is still $head. Bump it before merging: npm version <major|minor|patch> --no-git-tag-version, then add a CHANGELOG.md entry. If this PR ships no user-visible change, label it 'no-release'."
            exit 1
          fi

          # `sort -V` compares version numbers properly, so 1.10.0 counts as
          # newer than 1.9.0 (plain string comparison gets that backwards).
          newest=$(printf '%s\n%s\n' "$base" "$head" | sort -V | tail -1)
          if [ "$newest" != "$head" ]; then
            echo "::error file=package.json::Version went backwards, $base -> $head. The new version must be higher than the base branch."
            exit 1
          fi

          echo "Version bumped: $base -> $head"
